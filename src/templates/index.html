<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Broker App</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="container">
        <header class="topbar">
            <div class="brand">
                <span class="logo">📈</span>
                <div>
                    <h1>Broker Portfolio</h1>
                    <p class="subtitle">Учёт операций по брокерскому счёту</p>
                </div>
            </div>
        </header>

        <section class="card">
            <div class="card-head">
                <h2>Добавить операцию</h2>
            </div>

            <form id="op-form" class="grid-form">
                <label class="field">
                    <span>Дата и время</span>
                    <input type="datetime-local" name="date" required>
                </label>

                <label class="field">
                    <span>Тикер</span>
                    <input type="text" name="ticker" placeholder="SBER" autocomplete="off" required>
                </label>

                <label class="field">
                    <span>Тип</span>
                    <select name="side">
                        <option value="buy">Покупка</option>
                        <option value="sell">Продажа</option>
                    </select>
                </label>

                <label class="field">
                    <span>Количество</span>
                    <input type="number" step="any" name="quantity" placeholder="10" required>
                </label>

                <label class="field">
                    <span>Цена</span>
                    <input type="number" step="any" name="price" placeholder="250.5" required>
                </label>

                <label class="field">
                    <span>Комиссия</span>
                    <input type="number" step="any" name="commission" value="0">
                </label>

                <label class="field field-wide">
                    <span>Заметка</span>
                    <input type="text" name="note" placeholder="необязательно" autocomplete="off">
                </label>

                <div class="field field-action">
                    <button type="submit" class="btn btn-primary">
                        <span>+</span> Добавить операцию
                    </button>
                </div>
            </form>
        </section>

        <section class="card">
            <div class="card-head">
                <h2>Портфель</h2>
                <span class="badge" id="portfolio-count">0</span>
            </div>

            <div class="table-wrap">
                <table id="portfolio-table">
                    <thead>
                        <tr>
                            <th>Тикер</th>
                            <th class="num">Кол-во</th>
                            <th class="num">Средняя цена</th>
                            <th class="num">Вложено</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>

        <section class="card">
            <div class="card-head">
                <h2>История операций</h2>
                <span class="badge" id="ops-count">0</span>
            </div>

            <div class="table-wrap">
                <table id="ops-table">
                    <thead>
                        <tr>
                            <th>Дата</th>
                            <th>Тикер</th>
                            <th>Тип</th>
                            <th class="num">Кол-во</th>
                            <th class="num">Цена</th>
                            <th class="num">Комиссия</th>
                            <th>Заметка</th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </section>
    </div>

    <div id="toast" class="toast"></div>

    <script src="/static/app.js"></script>
</body>
</html>
